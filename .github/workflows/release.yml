name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    # macos-15 (arm64) has fast runner availability. The previous APFS
    # `hdiutil detach … resource busy` failures were not the runner's fault —
    # electron-builder builds both arch DMGs in parallel and they collided on a
    # shared volume mount. Fixed by giving each arch a unique DMG volume name
    # (see dmg.title "Argus ${arch}" in package.json).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + tags so the changelog step can find the previous tag
          # and diff the real range (a shallow clone has neither, which makes
          # PREV_TAG empty and the notes collapse to just the bump commit).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # node-pty is a native module; electron-builder's install-app-deps
      # rebuilds it via node-gyp, which needs distutils. Python 3.12+ removed
      # distutils from the stdlib, so pin 3.11 (ships distutils) on the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Go builds the argusd daemon binaries bundled into the DMG (package:mac
      # runs `make -C daemon build`).
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Install dependencies
        run: npm ci

      # Gate the signed release artifact on the same checks CI runs, in the
      # same order. ci.yml doesn't trigger on tag pushes, so these must run
      # inline here.
      #
      # Fail fast on the missing-root-dependency class (broke v0.21.0/v0.21.1)
      # before spending minutes on the rest. package:mac re-runs it as its
      # first command, so local packaging is guarded too.
      - name: Check dependency sync
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      # Build before Test: npm test includes the electron suite, which
      # type-checks electron/ against server/dist — absent until the server is
      # built. Testing first broke the v0.24.0 release run.
      - name: Build
        run: npm run build:all

      - name: Test
        run: npm test

      # package:mac:only — the Build step above already ran check:deps and
      # build:all; `package:mac` would repeat both (a full second build).
      - name: Package DMGs
        run: npm run package:mac:only
        env:
          # Developer ID signing + notarization. When these secrets are unset
          # they resolve to empty strings, so electron-builder.config.cjs takes
          # the ad-hoc fallback path and the build still succeeds. Set all five
          # (cert + Apple ID) to produce a signed, notarized DMG that macOS
          # trusts — required for native notification delivery.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Boot the actual packaged .app and require /api/health to answer before
      # anything is released, for BOTH architectures. Tests the artifact, not the
      # recipe: catches pruned asar deps, missing bundled binaries (argusd, tmux),
      # and broken native modules — the class that shipped broken v0.21.0/v0.21.1.
      # The x64 build runs under Rosetta on the arm64 runner.
      #
      # The .app is copied OUT of the workspace first, because Node resolves bare
      # specifiers by walking ancestor directories: run in place, an app missing a
      # package still finds the repo's own node_modules and boots happily. That is
      # how v0.22.5 got a ✔ here and still died at /Applications with
      # ERR_MODULE_NOT_FOUND. /tmp has no node_modules above it, like a real install.
      - name: Install Rosetta (x64 smoke test)
        run: softwareupdate --install-rosetta --agree-to-license

      - name: Smoke test packaged apps
        run: |
          smoke() {
            ARCH_LABEL="$1"; APP_SRC="$2"; shift 2
            SMOKE_ROOT="$(mktemp -d /tmp/argus-smoke.XXXXXX)"
            cp -R "$APP_SRC" "$SMOKE_ROOT/"
            APP="$SMOKE_ROOT/Argus.app"
            echo "[$ARCH_LABEL] smoking $APP (outside the checkout)"
            # Assert no ancestor carries a node_modules the app could borrow from.
            DIR="$SMOKE_ROOT"
            while [ "$DIR" != "/" ]; do
              if [ -d "$DIR/node_modules" ]; then
                echo "✖ $DIR/node_modules is above the smoke dir — resolution would not be hermetic"
                return 1
              fi
              DIR="$(dirname "$DIR")"
            done
            if [ -d /node_modules ]; then
              echo "✖ /node_modules exists — not hermetic"
              return 1
            fi
            "$@" "$APP/Contents/MacOS/Argus" > "smoke-$ARCH_LABEL.log" 2>&1 &
            APP_PID=$!
            # 120s: the x64 app runs under Rosetta on the arm64 runner and its
            # cold start (translation + first daemon spawn) took ~59s in v0.27.0,
            # so a 60s budget failed v0.27.1 on timing alone.
            for i in $(seq 1 120); do
              if curl -sf http://127.0.0.1:5757/api/health > /dev/null; then
                echo "✔ [$ARCH_LABEL] packaged app healthy after ~${i}s"
                kill "$APP_PID" 2>/dev/null || true
                # Free port 5757 for the next architecture.
                for j in $(seq 1 20); do
                  curl -sf http://127.0.0.1:5757/api/health > /dev/null || return 0
                  sleep 1
                done
                pkill -f "$SMOKE_ROOT" 2>/dev/null || true
                return 0
              fi
              # Died early (e.g. ERR_MODULE_NOT_FOUND on startup) — fail now.
              if ! kill -0 "$APP_PID" 2>/dev/null; then
                echo "✖ [$ARCH_LABEL] app process exited before becoming healthy"
                cat "smoke-$ARCH_LABEL.log"
                return 1
              fi
              sleep 1
            done
            echo "✖ [$ARCH_LABEL] /api/health never answered on 127.0.0.1:5757"
            cat "smoke-$ARCH_LABEL.log"
            kill "$APP_PID" 2>/dev/null || true
            return 1
          }

          smoke arm64 "dist/mac-arm64/Argus.app"
          smoke x64 "dist/mac/Argus.app" arch -x86_64

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA=$(shasum -a 256 "dist/Argus-${VERSION}-arm64.dmg" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "dist/Argus-${VERSION}.dmg" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arm=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "x64=${X64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          # Nearest v* tag reachable from the commit BEFORE this tag. Sorting all
          # tags by date picks up unrelated or out-of-order tags (hotfix on an
          # older line, a re-pushed tag) and yields the wrong range.
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${CURRENT_TAG}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            RAW=$(git log --pretty=format:"- %s" --no-merges)
          else
            RAW=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" --no-merges)
          fi
          # `|| true`: grep -v exits 1 when it filters out every line (a release
          # containing only chore:bump commits), which would fail the step under
          # `set -e`. An empty changelog is fine — the release still publishes.
          NOTES=$(echo "$RAW" | grep -v "^- chore: bump" || true)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          body: ${{ steps.changelog.outputs.notes }}

      - name: Update Cask
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          ARM: ${{ steps.sha.outputs.arm }}
          X64: ${{ steps.sha.outputs.x64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/antonioromano/argus.git"
          # Base the cask commit on the latest main, not the detached tag HEAD, and
          # open a PR rather than pushing to main (branch protection / review).
          git fetch origin main
          BRANCH="cask-bump-${VERSION}"
          git checkout -B "$BRANCH" origin/main

          python3 - <<'PYEOF'
          import re, os
          version = os.environ['VERSION']
          arm     = os.environ['ARM']
          x64     = os.environ['X64']

          with open('Casks/argus.rb') as f:
              content = f.read()

          content = re.sub(r'version "[^"]*"', f'version "{version}"', content)
          content = re.sub(
              r'(on_arm do\s+sha256 ")[a-f0-9]+(")',
              rf'\g<1>{arm}\g<2>',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'(on_intel do\s+sha256 ")[a-f0-9]+(")',
              rf'\g<1>{x64}\g<2>',
              content, flags=re.DOTALL
          )

          with open('Casks/argus.rb', 'w') as f:
              f.write(content)
          PYEOF

          git add Casks/argus.rb
          git commit -m "chore: bump cask to ${VERSION}"
          git push --force origin "$BRANCH"
          gh pr create --repo antonioromano/argus --base main --head "$BRANCH" \
            --title "chore: bump cask to ${VERSION}" \
            --body "Automated cask bump for v${VERSION} (new DMG checksums)."
          # Merge it right away: Homebrew users only see the new version once
          # the cask is on main. The PR stays as the audit trail.
          gh pr merge "$BRANCH" --repo antonioromano/argus --merge --delete-branch
