name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    # macos-15 (arm64) has fast runner availability. The previous APFS
    # `hdiutil detach … resource busy` failures were not the runner's fault —
    # electron-builder builds both arch DMGs in parallel and they collided on a
    # shared volume mount. Fixed by giving each arch a unique DMG volume name
    # (see dmg.title "Argus ${arch}" in package.json).
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Full history + tags so the changelog step can find the previous tag
          # and diff the real range (a shallow clone has neither, which makes
          # PREV_TAG empty and the notes collapse to just the bump commit).
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # node-pty is a native module; electron-builder's install-app-deps
      # rebuilds it via node-gyp, which needs distutils. Python 3.12+ removed
      # distutils from the stdlib, so pin 3.11 (ships distutils) on the runner.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Go builds the argusd daemon binaries bundled into the DMG (package:mac
      # runs `make -C daemon build`).
      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Install dependencies
        run: npm ci

      # Gate the signed release artifact on the same lint + test checks CI runs.
      # ci.yml doesn't trigger on tag pushes, so these must run inline here —
      # build:all (typecheck) already runs inside package:mac below.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Fail fast on the missing-root-dependency class (broke v0.21.0/v0.21.1)
      # before spending minutes on the packaging step. package:mac re-runs it
      # as its first command, so local packaging is guarded too.
      - name: Check dependency sync
        run: npm run check:deps

      - name: Build and package DMGs
        run: npm run package:mac
        env:
          # Developer ID signing + notarization. When these secrets are unset
          # they resolve to empty strings, so electron-builder.config.cjs takes
          # the ad-hoc fallback path and the build still succeeds. Set all five
          # (cert + Apple ID) to produce a signed, notarized DMG that macOS
          # trusts — required for native notification delivery.
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      # Boot the actual packaged .app (native arch) and require /api/health to
      # answer before anything is released. Tests the artifact, not the recipe:
      # catches pruned asar deps, missing bundled binaries (argusd, tmux), and
      # broken native modules — the class that shipped broken v0.21.0/v0.21.1.
      - name: Smoke test packaged app
        run: |
          APP="dist/mac-arm64/Argus.app"
          "$APP/Contents/MacOS/Argus" > smoke.log 2>&1 &
          APP_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5757/api/health > /dev/null; then
              echo "✔ packaged app healthy after ~${i}s"
              kill "$APP_PID" 2>/dev/null || true
              exit 0
            fi
            # Died early (e.g. ERR_MODULE_NOT_FOUND on startup) — fail now, not in 30s.
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "✖ app process exited before becoming healthy"
              cat smoke.log
              exit 1
            fi
            sleep 1
          done
          echo "✖ /api/health never answered on 127.0.0.1:5757"
          cat smoke.log
          kill "$APP_PID" 2>/dev/null || true
          exit 1

      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM_SHA=$(shasum -a 256 "dist/Argus-${VERSION}-arm64.dmg" | awk '{print $1}')
          X64_SHA=$(shasum -a 256 "dist/Argus-${VERSION}.dmg" | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "arm=${ARM_SHA}" >> "$GITHUB_OUTPUT"
          echo "x64=${X64_SHA}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT_TAG="${GITHUB_REF_NAME}"
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${CURRENT_TAG}$" | head -1)
          if [ -z "$PREV_TAG" ]; then
            RAW=$(git log --pretty=format:"- %s" --no-merges)
          else
            RAW=$(git log "${PREV_TAG}..${CURRENT_TAG}" --pretty=format:"- %s" --no-merges)
          fi
          # `|| true`: grep -v exits 1 when it filters out every line (a release
          # containing only chore:bump commits), which would fail the step under
          # `set -e`. An empty changelog is fine — the release still publishes.
          NOTES=$(echo "$RAW" | grep -v "^- chore: bump" || true)
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          fail_on_unmatched_files: true
          body: ${{ steps.changelog.outputs.notes }}

      - name: Update Cask
        env:
          VERSION: ${{ steps.sha.outputs.version }}
          ARM: ${{ steps.sha.outputs.arm }}
          X64: ${{ steps.sha.outputs.x64 }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/antonioromano/argus.git"
          # Always base the cask commit on the latest main, not the detached tag HEAD.
          # This prevents push rejection when main moves forward during the CI run.
          git fetch origin main
          git checkout -B cask-bump origin/main

          python3 - <<'PYEOF'
          import re, os
          version = os.environ['VERSION']
          arm     = os.environ['ARM']
          x64     = os.environ['X64']

          with open('Casks/argus.rb') as f:
              content = f.read()

          content = re.sub(r'version "[^"]*"', f'version "{version}"', content)
          content = re.sub(
              r'(on_arm do\s+sha256 ")[a-f0-9]+(")',
              rf'\g<1>{arm}\g<2>',
              content, flags=re.DOTALL
          )
          content = re.sub(
              r'(on_intel do\s+sha256 ")[a-f0-9]+(")',
              rf'\g<1>{x64}\g<2>',
              content, flags=re.DOTALL
          )

          with open('Casks/argus.rb', 'w') as f:
              f.write(content)
          PYEOF

          git add Casks/argus.rb
          git commit -m "chore: bump cask to ${VERSION}"
          git push origin cask-bump:main
