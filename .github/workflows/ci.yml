name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    # macOS runner matches the release pipeline and the product's only target;
    # node-pty ships a darwin prebuild and the tests assume a macOS shell.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Every server runtime dep must also be a ROOT dep or electron-builder
      # prunes it from app.asar and the packaged app breaks (broke v0.21.0 and
      # v0.21.1). Cheap static check; the release workflow also boot-tests the
      # real artifact.
      - name: Check dependency sync
        run: npm run check:deps

      - name: Lint
        run: npm run lint

      # build:all compiles shared -> server -> client -> electron, which doubles
      # as a full typecheck across every workspace.
      - name: Build (typecheck)
        run: npm run build:all

      - name: Test
        run: npm test

  daemon:
    # argusd pty-host daemon (Go) — vet, test, and cross-compile both macOS arches
    # (plan 2026-07-22-003). Independent of the Node job.
    runs-on: macos-15
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build (arm64 + x64)
        run: make build
