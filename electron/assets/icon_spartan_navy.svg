<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background: macOS rounded rect -->
  <rect width="512" height="512" rx="80" fill="#0d1b2a"/>

  <!-- Plume: trapezoid fin, narrow at tip, fans out at base -->
  <path d="M 238 18 Q 256 14 274 18 L 328 108 L 184 108 Z" fill="#ffffff"/>

  <!-- Helmet body: dome arch (with shoulder notches for cheek-guard flare),
       straight cheek sides, inward-curving chin -->
  <path d="
    M 128 168
    Q 256 -22 384 168
    L 440 168
    L 440 328
    Q 428 412 346 442
    Q 312 454 256 456
    Q 200 454 166 442
    Q 84 412 72 328
    L 72 168
    Z
  " fill="#ffffff"/>

  <!-- Left eye slot -->
  <rect x="132" y="214" width="104" height="46" rx="10" fill="#0d1b2a"/>

  <!-- Right eye slot -->
  <rect x="276" y="214" width="104" height="46" rx="10" fill="#0d1b2a"/>
</svg>
